<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一般醫學長期導師評核平台｜奇美醫療財團法人奇美醫院</title>
<style>
  :root {
    --primary: #8e3b46;
    --primary-dark: #6e2c35;
    --primary-light: #f7edee;
    --accent: #b08d57;
    --bg: #ffffff;
    --card: rgba(255,255,255,.62);
    --card-border: #e6e9ef;
    --glass-shadow: 0 6px 24px rgba(28,35,80,.10);
    --text: #2b2b2b;
    --muted: #6f7580;
    --border: #dfe3e8;
    --green: #2e7d54;
    --orange: #c07b1a;
    --blue: #2b5f8a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 依身分切換整體配色（點選身分卡後套用） */
  /* 導師沿用預設酒紅品牌色，不另外覆寫 */
  body.theme-chief { --primary: #2b5f8a; --primary-dark: #204a6d; --primary-light: #e7eef5; }
  body.theme-dean  { --primary: #2e7d54; --primary-dark: #226141; --primary-light: #e6f3ec; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    color: var(--text); min-height: 100vh; background: var(--bg);
  }
  header.topbar {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: #fff; padding: 18px 28px; display: flex; align-items: center; gap: 16px;
    box-shadow: 0 4px 24px rgba(31,38,80,.18);
    position: sticky; top: 0; z-index: 20;
  }
  header.topbar .logo {
    width: 44px; height: 44px; border-radius: 50%; background: #fff; color: var(--primary);
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px;
    flex-shrink: 0;
  }
  header.topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  header.topbar .sub { font-size: 12.5px; opacity: .85; margin-top: 2px; }
  header.topbar .role-badge {
    margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px;
  }
  header.topbar .role-badge span.badge {
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4);
    padding: 4px 14px; border-radius: 999px;
  }
  header.topbar button.logout {
    background: #fff; color: var(--primary); border: none; padding: 6px 16px;
    border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }

  /* ── 角色選擇 ── */
  .role-select { text-align: center; padding-top: 30px; }
  .role-select h2 { font-size: 22px; margin-bottom: 6px; color: var(--primary-dark); }
  .role-select p.hint { color: var(--muted); font-size: 14px; margin-bottom: 30px; }
  .role-cards { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
  .role-card {
    --rc: var(--primary);
    background: var(--card);
    backdrop-filter: blur(22px) saturate(165%);
    -webkit-backdrop-filter: blur(22px) saturate(165%);
    border: 1px solid var(--card-border); border-radius: 16px;
    border-top: 4px solid var(--rc);
    width: 270px; padding: 34px 24px 28px; cursor: pointer;
    transition: transform .18s, box-shadow .18s, background .18s;
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .role-card.rc-chief { --rc: var(--blue); }
  .role-card.rc-dean { --rc: var(--green); }
  .role-card:hover {
    transform: translateY(-5px); background: rgba(255,255,255,.86);
    box-shadow: 0 16px 40px rgba(31,38,80,.18), inset 0 1px 0 rgba(255,255,255,.85);
  }
  .role-card .icon { margin-bottom: 14px; }
  .role-card .icon .svg-icon { color: var(--rc); }
  .role-card h3 { font-size: 18px; color: var(--rc); margin-bottom: 8px; }
  .role-card p { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* ── 通用卡片 / 按鈕 ── */
  .card {
    background: var(--card);
    backdrop-filter: blur(22px) saturate(165%);
    -webkit-backdrop-filter: blur(22px) saturate(165%);
    border: 1px solid var(--card-border); border-radius: 16px;
    padding: 26px 30px; margin-bottom: 22px;
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .card h2 { font-size: 18px; color: var(--primary-dark); margin-bottom: 18px;
    padding-bottom: 10px; border-bottom: 2px solid var(--primary-light); }
  .btn {
    display: inline-block; border: none; border-radius: 8px; padding: 10px 26px;
    font-size: 15px; cursor: pointer; font-weight: 600; letter-spacing: 1px;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .88; }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; box-shadow: 0 4px 14px rgba(31,38,80,.18);
  }
  .btn-outline {
    background: rgba(255,255,255,.7); color: var(--primary); border: 1.5px solid var(--primary);
  }
  .btn-sm { padding: 6px 16px; font-size: 13.5px; }
  .btn:disabled { background: #bbb; cursor: not-allowed; }

  /* ── 表單 ── */
  .form-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
  .form-group { flex: 1; min-width: 220px; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #444; }
  .form-group label .req { color: #c0392b; }
  .form-group input[type=text], .form-group input[type=date],
  .form-group input[type=password],
  .form-group select, .form-group textarea {
    width: 100%; padding: 9px 12px; border: 1px solid rgba(0,0,0,.12); border-radius: 10px;
    font-size: 15px; font-family: inherit; background: rgba(255,255,255,.8);
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .form-group textarea { resize: vertical; min-height: 90px; }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    outline: none; border-color: var(--primary); background: #fff;
    box-shadow: 0 0 0 3px var(--primary-light);
  }

  table.score-table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
  table.score-table th, table.score-table td {
    border: 1px solid var(--border); padding: 11px 12px; font-size: 14.5px; text-align: center;
  }
  table.score-table th { background: var(--primary-light); color: var(--primary-dark); font-weight: 700; }
  table.score-table td.item-name { text-align: left; line-height: 1.55; }
  table.score-table input[type=number] {
    width: 80px; padding: 7px 8px; border: 1px solid rgba(0,0,0,.12); border-radius: 8px;
    font-size: 15px; text-align: center; background: rgba(255,255,255,.85);
    transition: border-color .15s, box-shadow .15s;
  }
  table.score-table input[type=number]:focus {
    outline: none; border-color: var(--primary); background: #fff;
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  table.score-table input[type=number]:disabled { background: #f0f0f0; color: #999; border-color: #e5e5e5; }
  table.score-table tr.total-row td { font-weight: 700; background: rgba(255,255,255,.55); font-size: 15.5px; }
  .score-note { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  td.readonly-score { font-weight: 600; color: var(--blue); }

  /* ── 清單 ── */
  table.list-table { width: 100%; border-collapse: collapse; }
  table.list-table th, table.list-table td {
    border-bottom: 1px solid var(--border); padding: 12px 10px; font-size: 14.5px; text-align: left;
  }
  table.list-table th { color: var(--muted); font-weight: 600; font-size: 13px; }
  table.list-table tr:hover td { background: rgba(255,255,255,.65); }
  .status-tag {
    display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  }
  .st-pending_chief { background: #fdf1e0; color: var(--orange); }
  .st-pending_dean  { background: #e7eef5; color: var(--blue); }
  .st-completed     { background: #e6f3ec; color: var(--green); }
  .empty-hint { text-align: center; color: var(--muted); padding: 34px 0; font-size: 14.5px; }

  .info-strip {
    display: flex; gap: 26px; flex-wrap: wrap; background: var(--primary-light);
    border: 1px solid rgba(255,255,255,.6);
    border-radius: 12px; padding: 14px 20px; margin-bottom: 20px; font-size: 14.5px;
  }
  .info-strip b { color: var(--primary-dark); }

  .feedback-box {
    background: rgba(255,255,255,.6); border: 1px solid rgba(0,0,0,.08); border-radius: 10px;
    padding: 12px 16px; font-size: 14.5px; line-height: 1.7; white-space: pre-wrap; min-height: 44px;
  }
  .section-label { font-size: 14px; font-weight: 700; color: var(--primary-dark); margin: 18px 0 8px; }

  .sig-line { display: flex; gap: 30px; flex-wrap: wrap; font-size: 14.5px; margin-top: 6px; }
  .sig-line .sig { color: #333; }
  .sig-line .sig b { color: var(--primary-dark); }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: #fff; padding: 12px 28px; border-radius: 10px;
    font-size: 15px; box-shadow: 0 8px 28px rgba(31,38,80,.28); z-index: 99; display: none;
    border: 1px solid rgba(255,255,255,.28);
  }
  .toast.error { background: #b3403a; }
  .busy-overlay {
    position: fixed; inset: 0; background: rgba(240,243,248,.5); z-index: 98;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; color: var(--primary-dark);
  }
  .spinner {
    width: 22px; height: 22px; border: 3px solid var(--primary-light);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin .8s linear infinite; margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .svg-icon { display: inline-block; vertical-align: -3px; color: var(--primary); }
  .card h2 .svg-icon { margin-right: 8px; }
  .actions-bar { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
  .back-link { color: var(--primary); cursor: pointer; font-size: 14px; margin-bottom: 14px; display: inline-block; }
  .back-link:hover { text-decoration: underline; }

  /* ── 列印表單 ── */
  .print-sheet {
    background: #fff; border: 1px solid var(--card-border); border-radius: 16px;
    padding: 40px 46px; box-shadow: var(--glass-shadow);
  }
  .print-sheet .hosp { text-align: center; line-height: 1.5; margin-bottom: 4px; }
  .print-sheet .hosp .zh { font-size: 19px; font-weight: 700; letter-spacing: 2px; }
  .print-sheet .hosp .en { font-size: 13px; color: #555; }
  .print-sheet .form-title { text-align: center; font-size: 17px; font-weight: 700; margin: 10px 0 18px; letter-spacing: 1px; }
  .print-sheet table { width: 100%; border-collapse: collapse; margin-bottom: 0; }
  .print-sheet table th, .print-sheet table td { border: 1px solid #444; padding: 9px 10px; font-size: 14px; }
  .print-sheet table th { background: #f2f2f2; text-align: center; }
  .print-sheet .sig-block { margin-top: 26px; font-size: 14.5px; line-height: 2.4; }

  @media print {
    body { background: #fff !important; }
    header.topbar, .no-print, .toast, .busy-overlay { display: none !important; }
    main { max-width: none; padding: 0; }
    .print-sheet { border: none; border-radius: 0; box-shadow: none; padding: 10px 6px; }
    .card, .print-sheet {
      background: #fff !important; backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .card { border: none; box-shadow: none; padding: 0; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">奇</div>
  <div>
    <h1>一般醫學長期導師評核平台</h1>
    <div class="sub">奇美醫療財團法人奇美醫院 Chi Mei Medical Center</div>
  </div>
  <div class="role-badge no-print" id="roleBadge" style="display:none">
    <span class="badge" id="roleBadgeText"></span>
    <button class="logout" onclick="logout()">切換身分</button>
  </div>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>
<div class="busy-overlay" id="busy"><span class="spinner"></span>處理中，請稍候…</div>

<script>
/* ═══════════════ 資料層 ═══════════════ */
/* ── Google Sheets 後端設定 ──
   依 README「Google Sheets 資料庫設定」部署 Apps Script 後，
   將取得的網址（https://script.google.com/macros/s/…/exec）貼到 API_URL。
   留空則使用瀏覽器 localStorage 單機測試模式。 */
const API_URL = 'https://script.google.com/macros/s/AKfycbzip0U90AYOS1vsLQJpZfHDWpxB5wtZJ4Kzj1cZdbUt4uwUZSb11SFBgSWEPoZvfkV-yw/exec';
const USE_API = /^https:/.test(API_URL);

const STORE_KEY = 'pgy_mentor_assessments_v1';
const PERIOD = '115年1 ~ 6月';
const ITEMS = [
  { text: '1.是否每月1次與導生座談。', max: 35 },
  { text: '2.是否每月繳交座談記錄單。', max: 20 },
  { text: '3.當導生出現困難時是否積極幫忙輔導。', max: 25 },
  { text: '4.導生若有生活或學習困難是否主動告知教學部。', max: 20 },
];
const STATUS_LABEL = {
  pending_chief: '待一般科主任評核',
  pending_dean:  '待教學部部長評核',
  completed:     '已完成',
};
const ROLE_LABEL = { teacher: '導師', chief: '一般科主任', dean: '教學部部長' };

/* ── 導師名單（僅單機測試模式使用；Google Sheets 模式改由 teachers 工作表維護）── */
const TEACHERS = {
  '王小明': '一般內科',
  '林美慧': '家庭醫學科',
  '張志豪': '一般外科',
  '陳雅婷': '小兒科',
  '李國強': '急診醫學科',
};

/* ── 主管密碼（僅單機測試模式使用；Google Sheets 模式由 Apps Script 驗證）── */
const ROLE_PASSWORDS = { chief: '940963', dean: '010101' };

/* ── 主管簽名（送出時自動帶入，日期為當天）── */
const ROLE_SIGNERS = { chief: '郭妍伶', dean: '蘇慧真' };

let RECORDS = [];

async function api(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function loadLocal() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; } }

/* 試算表會把日期轉成日期物件，讀回時統一整理成 yyyy-mm-dd 字串 */
function normDate(v) {
  if (!v || typeof v !== 'string') return v;
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const d = new Date(v);
  if (isNaN(d)) return v;
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}
function normalizeRecord(r) {
  r.submittedAt = normDate(r.submittedAt);
  ['teacher', 'chief', 'dean'].forEach(k => {
    if (r.sigs && r.sigs[k]) r.sigs[k].date = normDate(r.sigs[k].date);
  });
  return r;
}

async function refreshRecords() {
  RECORDS = USE_API
    ? (await api({ action: 'getRecords' })).records.map(normalizeRecord)
    : loadLocal();
  return RECORDS;
}

function loadAll() { return RECORDS; }
function getRec(id) { return RECORDS.find(r => r.id === id); }

async function persist(rec) {
  if (USE_API) {
    RECORDS = (await api({ action: 'saveRecord', record: rec })).records.map(normalizeRecord);
  } else {
    const list = loadLocal();
    const i = list.findIndex(r => r.id === rec.id);
    if (i >= 0) list[i] = rec; else list.push(rec);
    localStorage.setItem(STORE_KEY, JSON.stringify(list));
    RECORDS = list;
  }
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function sum(arr)   { return arr.reduce((a, b) => a + (Number(b) || 0), 0); }

/* ═══════════════ 共用 UI ═══════════════ */
let currentRole = null;
let currentTeacher = null;
let currentUnit = null;
const app = document.getElementById('app');

function setBusy(on) { document.getElementById('busy').style.display = on ? 'flex' : 'none'; }

/* ── 簡約線條圖示（SVG）── */
function icon(name, size) {
  const paths = {
    person: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>',
    stethoscope: '<path d="M5 3v5a6 6 0 0 0 12 0V3"/><path d="M11 14v2a4.5 4.5 0 0 0 9 0v-2.5"/><circle cx="20" cy="11" r="2.5"/>',
    building: '<path d="M3 21h18"/><path d="M5 21V9h14v12"/><path d="M12 3 4 9h16z"/><path d="M9 21v-6M15 21v-6"/>',
    clipboard: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v4H9z"/><path d="M9 12h6M9 16h6"/>',
    bell: '<path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 19a2 2 0 0 0 4 0"/>',
    folder: '<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    printer: '<path d="M7 8V3h10v5"/><rect x="4" y="8" width="16" height="8" rx="1.5"/><path d="M7 13h10v8H7z"/>',
  };
  return `<svg class="svg-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${paths[name] || ''}</svg>`;
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2400);
}
function toastErr(msg) { return toast(msg, 'error'); }
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function statusTag(st) { return `<span class="status-tag st-${st}">${STATUS_LABEL[st]}</span>`; }

function setTheme(role) { document.body.className = role ? 'theme-' + role : ''; }

function setRole(role) {
  currentRole = role;
  setTheme(role);
  const badge = document.getElementById('roleBadge');
  badge.style.display = role ? 'flex' : 'none';
  if (role) {
    const who = (role === 'teacher' && currentTeacher) ? `${ROLE_LABEL[role]}｜${currentTeacher}` : ROLE_LABEL[role];
    document.getElementById('roleBadgeText').textContent = '目前身分：' + who;
  }
}
function logout() { currentTeacher = null; currentUnit = null; setRole(null); renderRoleSelect(); }

/* ═══════════════ 角色選擇 ═══════════════ */
function renderRoleSelect() {
  setTheme(null);
  app.innerHTML = `
    <div class="role-select">
      <h2>請選擇您的身分</h2>
      <p class="hint">依身分進入對應的評核流程：導師自評 → 一般科主任評核 → 教學部部長評核</p>
      <div class="role-cards">
        <div class="role-card" onclick="enter('teacher')">
          <div class="icon">${icon('person', 42)}</div>
          <h3>導師</h3>
          <p>輸入姓名即自動帶出單位並進入自評表，送出後系統自動代簽。</p>
        </div>
        <div class="role-card rc-chief" onclick="enter('chief')">
          <div class="icon">${icon('stethoscope', 42)}</div>
          <h3>一般科主任</h3>
          <p>輸入密碼登入後，可檢視所有導師自評並逐一評分回饋，送交教學部部長。</p>
        </div>
        <div class="role-card rc-dean" onclick="enter('dean')">
          <div class="icon">${icon('building', 42)}</div>
          <h3>教學部部長</h3>
          <p>輸入密碼登入後，完成最終評分、回饋與學員滿意度登錄並結案。</p>
        </div>
      </div>
    </div>`;
}
function enter(role) {
  setTheme(role);
  if (role === 'teacher') renderTeacherLogin();
  else renderPasswordGate(role);
}

/* ═══════════════ 導師：姓名登入 ═══════════════ */
function renderTeacherLogin() {
  app.innerHTML = `
    <span class="back-link" onclick="renderRoleSelect()">← 返回身分選擇</span>
    <div class="card" style="max-width:460px;margin:30px auto">
      <h2>${icon('person', 18)}導師登入</h2>
      <div class="form-group" style="margin-bottom:16px">
        <label>請輸入您的姓名 <span class="req">*</span></label>
        <input type="text" id="loginName" placeholder="輸入姓名後將自動帶出您的單位"
               onkeydown="if(event.key==='Enter')teacherLogin()">
      </div>
      <div class="actions-bar" style="justify-content:center">
        <button class="btn btn-primary" style="width:100%" onclick="teacherLogin()">登入 →</button>
      </div>
    </div>`;
  document.getElementById('loginName').focus();
}

async function teacherLogin() {
  const name = document.getElementById('loginName').value.trim();
  if (!name) return toastErr('請輸入姓名');
  setBusy(true);
  try {
    if (USE_API) {
      const r = await api({ action: 'teacherLogin', name });
      if (!r.ok) return toastErr('名單中查無此姓名，請確認輸入是否正確或洽教學部');
      currentUnit = r.unit;
    } else {
      if (!(name in TEACHERS)) return toastErr('名單中查無此姓名，請確認輸入是否正確或洽教學部');
      currentUnit = TEACHERS[name];
    }
    currentTeacher = name;
    setRole('teacher');
    await refreshRecords();
    const mine = RECORDS.filter(r => r.name === name && r.period === PERIOD);
    if (mine.length) renderTeacherHome();
    else renderTeacherForm();
  } catch (e) {
    toastErr('連線失敗，請稍後再試（' + e.message + '）');
  } finally {
    setBusy(false);
  }
}

/* ═══════════════ 主任 / 部長：密碼登入 ═══════════════ */
function renderPasswordGate(role) {
  app.innerHTML = `
    <span class="back-link" onclick="renderRoleSelect()">← 返回身分選擇</span>
    <div class="card" style="max-width:460px;margin:30px auto">
      <h2>${icon('lock', 18)}${ROLE_LABEL[role]}登入</h2>
      <div class="form-group" style="margin-bottom:16px">
        <label>請輸入密碼 <span class="req">*</span></label>
        <input type="password" id="gatePwd" placeholder="請輸入${ROLE_LABEL[role]}密碼"
               onkeydown="if(event.key==='Enter')checkGate('${role}')">
      </div>
      <div class="actions-bar" style="justify-content:center">
        <button class="btn btn-primary" style="width:100%" onclick="checkGate('${role}')">登入 →</button>
      </div>
    </div>`;
  document.getElementById('gatePwd').focus();
}

async function checkGate(role) {
  const pwd = document.getElementById('gatePwd').value;
  setBusy(true);
  try {
    if (USE_API) {
      const r = await api({ action: 'login', role, password: pwd });
      if (!r.ok) return toastErr('密碼錯誤，請重新輸入');
    } else {
      if (pwd !== ROLE_PASSWORDS[role]) return toastErr('密碼錯誤，請重新輸入');
    }
    setRole(role);
    await renderReviewList(role);
  } catch (e) {
    toastErr('連線失敗，請稍後再試（' + e.message + '）');
  } finally {
    setBusy(false);
  }
}

/* ═══════════════ 導師端 ═══════════════ */
async function renderTeacherHome() {
  if (USE_API) {
    setBusy(true);
    try { await refreshRecords(); }
    catch (e) { toastErr('讀取資料失敗（' + e.message + '）'); }
    finally { setBusy(false); }
  }
  const list = loadAll().filter(r => r.name === currentTeacher);
  const rows = list.map(r => `
    <tr>
      <td>${esc(r.name)}</td>
      <td>${esc(r.unit)}</td>
      <td>${r.selfTotal} / 100</td>
      <td>${statusTag(r.status)}</td>
      <td>${esc(r.submittedAt || '')}</td>
      <td><button class="btn btn-outline btn-sm" onclick="renderDetail('${r.id}')">檢視</button></td>
    </tr>`).join('');
  app.innerHTML = `
    <div class="card">
      <h2>${icon('clipboard', 18)}我的評核表（${PERIOD}）</h2>
      ${list.length ? `
        <table class="list-table">
          <tr><th>導師姓名</th><th>單位</th><th>自評總分</th><th>狀態</th><th>送出日期</th><th></th></tr>
          ${rows}
        </table>` : `<div class="empty-hint">尚無評核紀錄。</div>`}
      ${list.length ? '' : `<div style="text-align:center"><button class="btn btn-primary" onclick="renderTeacherForm()">開始填寫評核表 →</button></div>`}
    </div>`;
}

function renderTeacherForm() {
  const name = currentTeacher;
  const unit = currentUnit || '';
  const itemRows = ITEMS.map((it, i) => `
    <tr>
      <td class="item-name">${esc(it.text)}</td>
      <td>${it.max}</td>
      <td><input type="number" id="self_${i}" min="0" max="${it.max}" value=""
           oninput="clampScore(this, ${it.max}); updateSelfTotal()"></td>
    </tr>`).join('');
  app.innerHTML = `
    <span class="back-link" onclick="renderTeacherHome()">← 返回我的評核表</span>
    <div class="card">
      <h2>一般醫學長期導師評核表（${PERIOD}）— 導師自評</h2>
      <div class="info-strip">
        <div><b>姓名：</b>${esc(name)}</div>
        <div><b>單位：</b>${esc(unit)}</div>
        <div><b>日期：</b>${todayStr()}</div>
      </div>
      <div class="section-label">評量內容（自評）</div>
      <table class="score-table">
        <tr><th style="width:56%">評量內容</th><th>配分</th><th>自評得分</th></tr>
        ${itemRows}
        <tr class="total-row"><td class="item-name" style="text-align:center">總　積　分</td><td>100</td><td id="selfTotalCell">0</td></tr>
      </table>
      <div class="score-note">※ 各項得分不得超過配分上限。送出後系統將自動以您的姓名代替簽名。</div>
      <div class="actions-bar">
        <button class="btn btn-outline" onclick="renderTeacherHome()">取消</button>
        <button class="btn btn-primary" onclick="submitTeacherForm()">送出評核表 →</button>
      </div>
    </div>`;
}

function clampScore(input, max) {
  if (input.value === '') return;
  let v = Number(input.value);
  if (isNaN(v) || v < 0) v = 0;
  if (v > max) v = max;
  input.value = v;
}
function updateSelfTotal() {
  const scores = ITEMS.map((_, i) => Number(document.getElementById('self_' + i).value) || 0);
  document.getElementById('selfTotalCell').textContent = sum(scores);
}

async function submitTeacherForm() {
  const name = currentTeacher;
  const unit = currentUnit || '';
  const scores = ITEMS.map((_, i) => document.getElementById('self_' + i).value);
  if (scores.some(s => s === '')) return toastErr('請完成所有自評項目');
  const rec = {
    id: 'r' + Date.now(),
    period: PERIOD, name, unit,
    selfScores: scores.map(Number), selfTotal: sum(scores),
    chiefScores: null, chiefTotal: null, chiefFeedback: '',
    deanScores: null, deanTotal: null, deanFeedback: '',
    satisfaction: null,
    sigs: { teacher: { name, date: todayStr() }, chief: null, dean: null },
    status: 'pending_chief',
    submittedAt: todayStr(),
  };
  setBusy(true);
  try {
    await persist(rec);
    toast('已送出，將由一般科主任進行評核');
    renderTeacherHome();
  } catch (e) {
    toastErr('送出失敗，請稍後再試（' + e.message + '）');
  } finally {
    setBusy(false);
  }
}

/* ═══════════════ 主任 / 部長：待辦清單 ═══════════════ */
async function renderReviewList(role) {
  if (USE_API) {
    setBusy(true);
    try { await refreshRecords(); }
    catch (e) { toastErr('讀取資料失敗（' + e.message + '）'); }
    finally { setBusy(false); }
  }
  const pendingStatus = role === 'chief' ? 'pending_chief' : 'pending_dean';
  const list = loadAll();
  const pending = list.filter(r => r.status === pendingStatus);
  const others  = list.filter(r => r.status !== pendingStatus);
  const row = (r, actionable) => `
    <tr>
      <td>${esc(r.name)}</td>
      <td>${esc(r.unit)}</td>
      <td>${r.selfTotal} / 100</td>
      <td>${statusTag(r.status)}</td>
      <td>
        ${actionable
          ? `<button class="btn btn-primary btn-sm" onclick="renderReviewForm('${r.id}','${role}')">進行評核</button>`
          : `<button class="btn btn-outline btn-sm" onclick="renderDetail('${r.id}')">檢視</button>`}
      </td>
    </tr>`;
  app.innerHTML = `
    <div class="card">
      <h2>${icon('bell', 18)}待評核（${ROLE_LABEL[role]}）</h2>
      ${pending.length ? `
        <table class="list-table">
          <tr><th>導師姓名</th><th>單位</th><th>自評總分</th><th>狀態</th><th></th></tr>
          ${pending.map(r => row(r, true)).join('')}
        </table>` : `<div class="empty-hint">目前沒有待評核的表單。</div>`}
    </div>
    <div class="card">
      <h2>${icon('folder', 18)}其他評核表</h2>
      ${others.length ? `
        <table class="list-table">
          <tr><th>導師姓名</th><th>單位</th><th>自評總分</th><th>狀態</th><th></th></tr>
          ${others.map(r => row(r, false)).join('')}
        </table>` : `<div class="empty-hint">尚無其他紀錄。</div>`}
    </div>`;
}

/* ═══════════════ 主任 / 部長：評核表單 ═══════════════ */
function renderReviewForm(id, role) {
  const r = getRec(id);
  if (!r) return;
  const isChief = role === 'chief';
  const colLabel = isChief ? '一般科主任評分' : '教學部部長評分';
  const itemRows = ITEMS.map((it, i) => `
    <tr>
      <td class="item-name">${esc(it.text)}</td>
      <td>${it.max}</td>
      <td class="readonly-score">${r.selfScores[i]}</td>
      ${isChief ? '' : `<td class="readonly-score">${r.chiefScores[i]}</td>`}
      <td><input type="number" id="rev_${i}" min="0" max="${it.max}" value=""
           oninput="clampScore(this, ${it.max}); updateRevTotal()"></td>
    </tr>`).join('');
  app.innerHTML = `
    <span class="back-link" onclick="renderReviewList('${role}')">← 返回待辦清單</span>
    <div class="card">
      <h2>${ROLE_LABEL[role]}評核</h2>
      <div class="info-strip">
        <div><b>期別：</b>${PERIOD}</div>
        <div><b>導師：</b>${esc(r.name)}</div>
        <div><b>單位：</b>${esc(r.unit)}</div>
        <div><b>導師送出日期：</b>${esc(r.submittedAt)}</div>
      </div>
      <table class="score-table">
        <tr>
          <th style="width:44%">評量內容</th><th>配分</th><th>自評得分</th>
          ${isChief ? '' : '<th>一般科主任評分</th>'}
          <th>${colLabel}</th>
        </tr>
        ${itemRows}
        <tr class="total-row">
          <td class="item-name" style="text-align:center">總　積　分</td>
          <td>100</td><td>${r.selfTotal}</td>
          ${isChief ? '' : `<td>${r.chiefTotal}</td>`}
          <td id="revTotalCell">0</td>
        </tr>
      </table>
      <div class="score-note">※ 各項得分不得超過配分上限。</div>
      ${isChief ? '' : `
        <div class="section-label">一般科主任回饋</div>
        <div class="feedback-box">${esc(r.chiefFeedback) || '（無）'}</div>
        <div class="section-label">學員對導師滿意度（一般科主任填寫）</div>
        <div class="feedback-box">${r.satisfaction ? r.satisfaction + ' 分' : '（無）'}</div>`}
      <div class="section-label">${ROLE_LABEL[role]}回饋 <span class="req">*</span></div>
      <div class="form-group">
        <textarea id="revFeedback" placeholder="請填寫對導師之回饋建議"></textarea>
      </div>
      ${!isChief ? '' : `
        <div class="form-row" style="margin-top:14px">
          <div class="form-group">
            <label>學員對導師滿意度（1－5 分） <span class="req">*</span></label>
            <select id="satisfaction">
              <option value="">請選擇</option>
              <option value="5">5 分（非常滿意）</option>
              <option value="4">4 分（滿意）</option>
              <option value="3">3 分（普通）</option>
              <option value="2">2 分（不滿意）</option>
              <option value="1">1 分（非常不滿意）</option>
            </select>
          </div>
        </div>`}
      <div class="score-note" style="margin-top:14px">
        ※ 送出後系統將自動簽名：${ROLE_LABEL[role]}「${ROLE_SIGNERS[role]}」，日期為 ${todayStr()}。
      </div>
      <div class="actions-bar">
        <button class="btn btn-outline" onclick="renderReviewList('${role}')">取消</button>
        <button class="btn btn-primary" onclick="submitReview('${id}','${role}')">
          ${isChief ? '完成評核，送交教學部部長 →' : '完成最終評核，結案'}
        </button>
      </div>
    </div>`;
}

function updateRevTotal() {
  const scores = ITEMS.map((_, i) => Number(document.getElementById('rev_' + i).value) || 0);
  document.getElementById('revTotalCell').textContent = sum(scores);
}

async function submitReview(id, role) {
  const r = getRec(id);
  if (!r) return;
  const scores = ITEMS.map((_, i) => document.getElementById('rev_' + i).value);
  const feedback = document.getElementById('revFeedback').value.trim();
  const sig = ROLE_SIGNERS[role];
  const date = todayStr();
  if (scores.some(s => s === '')) return toastErr('請完成所有評分項目');
  if (!feedback) return toastErr('請填寫回饋');
  if (role === 'chief') {
    const sat = document.getElementById('satisfaction').value;
    if (!sat) return toastErr('請選擇學員對導師滿意度');
    r.chiefScores = scores.map(Number);
    r.chiefTotal = sum(scores);
    r.chiefFeedback = feedback;
    r.satisfaction = Number(sat);
    r.sigs.chief = { name: sig, date };
    r.status = 'pending_dean';
  } else {
    r.deanScores = scores.map(Number);
    r.deanTotal = sum(scores);
    r.deanFeedback = feedback;
    r.sigs.dean = { name: sig, date };
    r.status = 'completed';
  }
  setBusy(true);
  try {
    await persist(r);
    toast(role === 'chief' ? '已完成主任評核，送交教學部部長' : '評核流程已全部完成');
    renderReviewList(role);
  } catch (e) {
    toastErr('儲存失敗，請稍後再試（' + e.message + '）');
  } finally {
    setBusy(false);
  }
}

/* ═══════════════ 檢視 / 列印完整表單 ═══════════════ */
function renderDetail(id) {
  const r = getRec(id);
  if (!r) return;
  const cell = v => (v === null || v === undefined) ? '' : v;
  const itemRows = ITEMS.map((it, i) => `
    <tr>
      <td style="text-align:left">${esc(it.text)}</td>
      <td style="text-align:center">${it.max}</td>
      <td style="text-align:center">${cell(r.selfScores?.[i])}</td>
      <td style="text-align:center">${cell(r.chiefScores?.[i])}</td>
      <td style="text-align:center">${cell(r.deanScores?.[i])}</td>
    </tr>`).join('');
  const sig = (s) => s ? `${esc(s.name)}　　日期：${esc(s.date)}` : '＿＿＿＿＿＿　　日期：＿＿＿＿＿＿';
  const backFn = currentRole === 'teacher' ? "renderTeacherHome()"
               : currentRole ? `renderReviewList('${currentRole}')` : 'renderRoleSelect()';
  app.innerHTML = `
    <span class="back-link no-print" onclick="${backFn}">← 返回</span>
    <div class="card no-print" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
      <div>目前狀態：${statusTag(r.status)}</div>
      <button class="btn btn-primary" onclick="window.print()">${icon('printer', 16)} 列印 / 另存 PDF</button>
    </div>
    <div class="print-sheet">
      <div class="hosp">
        <div class="zh">奇美醫療財團法人奇美醫院</div>
        <div class="en">Chi Mei Medical Center</div>
      </div>
      <div class="form-title">${PERIOD} 一般醫學長期導師評核表</div>
      <table>
        <tr>
          <th style="width:12%">姓名</th><td style="width:38%">${esc(r.name)}</td>
          <th style="width:12%">單位</th><td>${esc(r.unit)}</td>
        </tr>
      </table>
      <table style="border-top:none">
        <tr>
          <th style="width:40%">評量內容</th><th>配分</th><th>自評得分</th>
          <th>一般科主任評分</th><th>教學部部長評分</th>
        </tr>
        ${itemRows}
        <tr>
          <th>總　積　分</th>
          <td style="text-align:center;font-weight:700">100</td>
          <td style="text-align:center;font-weight:700">${cell(r.selfTotal)}</td>
          <td style="text-align:center;font-weight:700">${cell(r.chiefTotal)}</td>
          <td style="text-align:center;font-weight:700">${cell(r.deanTotal)}</td>
        </tr>
        <tr>
          <th rowspan="2">回饋</th>
          <th colspan="1">一般科主任</th>
          <td colspan="3" style="text-align:left;white-space:pre-wrap">${esc(r.chiefFeedback)}</td>
        </tr>
        <tr>
          <th colspan="1">教學部部長</th>
          <td colspan="3" style="text-align:left;white-space:pre-wrap">${esc(r.deanFeedback)}</td>
        </tr>
        <tr>
          <th>學員對導師滿意度</th>
          <td colspan="4" style="text-align:left">滿意度分數 1－5 分：<b>${cell(r.satisfaction)}</b>${r.satisfaction ? ' 分' : ''}</td>
        </tr>
      </table>
      <div class="sig-block">
        <div>導　師　簽　名：${sig(r.sigs.teacher)}</div>
        <div>一般科主任簽名：${sig(r.sigs.chief)}</div>
        <div>教學部部長簽名：${sig(r.sigs.dean)}</div>
      </div>
    </div>`;
}

/* ═══════════════ 啟動 ═══════════════ */
renderRoleSelect();
</script>
</body>
</html>
